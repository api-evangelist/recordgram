description: Recordgram is a mobile music-creation platform, now operating as Cre8tor (cre8tor.app),
  that lets aspiring artists record songs, write lyrics, access a library of beats, and collaborate
  with professional producers directly from a smartphone. The company won the TechCrunch Disrupt SF
  2017 Startup Battlefield and is backed by Lightspeed Venture Partners. It is a consumer iOS/Android
  application with no public developer API, documentation, SDK, or developer portal surfaced at this
  time. This profile was surfaced as a portfolio company of Lightspeed Venture Partners and added to
  the API Evangelist network; enrichment confirmed the consumer-app nature and the rebrand to Cre8tor.
